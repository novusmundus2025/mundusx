name: Release CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: opengpu-x86_64-unknown-linux-gnu
            executable_name: opengpu
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: opengpu-aarch64-apple-darwin
            executable_name: opengpu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: opengpu-x86_64-pc-windows-msvc.exe
            executable_name: opengpu.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --manifest-path apps/cli/Cargo.toml --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.executable_name }} ${{ matrix.binary_name }}
          if [[ "${{ matrix.os }}" != windows-* ]]; then
            chmod +x ${{ matrix.binary_name }}
          fi

      - name: Generate checksum
        shell: bash
        run: |
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 ${{ matrix.binary_name }} > ${{ matrix.binary_name }}.sha256
          elif command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.binary_name }} > ${{ matrix.binary_name }}.sha256
          else
            echo "checksum tooling not found (need shasum or sha256sum)" >&2
            exit 1
          fi

      - name: Verify checksum
        shell: bash
        run: |
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 -c ${{ matrix.binary_name }}.sha256
          elif command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c ${{ matrix.binary_name }}.sha256
          else
            echo "checksum tooling not found (need shasum or sha256sum)" >&2
            exit 1
          fi

      - name: Verify packaging
        shell: bash
        run: |
          ./scripts/verify-release-packaging.sh . ${{ matrix.binary_name }}

      - name: Prepare signed manifest
        shell: bash
        env:
          OPENGPU_RELEASE_SIGNING_PRIVATE_KEY_PEM_B64: ${{ secrets.OPENGPU_RELEASE_SIGNING_PRIVATE_KEY_PEM_B64 }}
          OPENGPU_RELEASE_SIGNING_PUBLIC_KEY_PEM_B64: ${{ secrets.OPENGPU_RELEASE_SIGNING_PUBLIC_KEY_PEM_B64 }}
        run: |
          ./scripts/release-signing.sh prepare . ${{ matrix.binary_name }} ${{ github.ref_name }} ${{ github.ref_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: |
            ${{ matrix.binary_name }}
            ${{ matrix.binary_name }}.sha256
            release-manifest.json
            release-manifest.json.sig

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Verify downloaded artifacts
        env:
          OPENGPU_RELEASE_SIGNING_PUBLIC_KEY_PEM_B64: ${{ secrets.OPENGPU_RELEASE_SIGNING_PUBLIC_KEY_PEM_B64 }}
        run: |
          find dist -name '*.sha256' -print0 | while IFS= read -r -d '' checksum_file; do
            artifact_dir="$(dirname "$checksum_file")"
            binary_name="$(basename "${checksum_file%.sha256}")"
            ./scripts/verify-release-packaging.sh "$artifact_dir" "$binary_name"
            ./scripts/release-signing.sh verify "$artifact_dir" "$binary_name"
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*/*
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
