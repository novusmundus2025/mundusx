name: Release CLI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build and publish, for example cli-v0.1.8"
        required: true
        type: string
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  MUNDUSX_RELEASE_VERSION: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: opengpu-x86_64-unknown-linux-gnu
            executable_name: opengpu
            mundusx_binary_name: mundusx-x86_64-unknown-linux-gnu
            mundusx_executable_name: mundusx
            agent_server_binary_name: mundusx-agent-server-x86_64-unknown-linux-gnu
            agent_server_executable_name: mundusx-agent-server
            agent_binary_name: opengpu-node-agent-x86_64-unknown-linux-gnu
            agent_executable_name: opengpu-node-agent
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: opengpu-aarch64-apple-darwin
            executable_name: opengpu
            mundusx_binary_name: mundusx-aarch64-apple-darwin
            mundusx_executable_name: mundusx
            agent_server_binary_name: mundusx-agent-server-aarch64-apple-darwin
            agent_server_executable_name: mundusx-agent-server
            agent_binary_name: opengpu-node-agent-aarch64-apple-darwin
            agent_executable_name: opengpu-node-agent
            pkg_name: MundusX-OpenGPU-Apple-Silicon.pkg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: opengpu-x86_64-pc-windows-msvc.exe
            executable_name: opengpu.exe
            mundusx_binary_name: mundusx-x86_64-pc-windows-msvc.exe
            mundusx_executable_name: mundusx.exe
            agent_server_binary_name: mundusx-agent-server-x86_64-pc-windows-msvc.exe
            agent_server_executable_name: mundusx-agent-server.exe
            agent_binary_name: opengpu-node-agent-x86_64-pc-windows-msvc.exe
            agent_executable_name: opengpu-node-agent.exe
            tray_binary_name: mundusx-tray-x86_64-pc-windows-msvc.exe
            tray_executable_name: mundusx-tray.exe
            setup_binary_name: MundusX-Setup.exe
            setup_executable_name: mundusx-bootstrap.exe
            runtime_binary_name: llama-runtime-x86_64-pc-windows-msvc-cuda.zip
            vulkan_runtime_binary_name: llama-runtime-x86_64-pc-windows-msvc-vulkan.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --manifest-path apps/cli/Cargo.toml --target ${{ matrix.target }}

      - name: Build MundusX agent server
        run: cargo build --release --manifest-path apps/agent-server/Cargo.toml --target ${{ matrix.target }}

      - name: Build node agent
        run: cargo build --release --manifest-path agents/node/Cargo.toml --bin opengpu-node-agent --target ${{ matrix.target }}

      - name: Build Windows tray companion
        if: startsWith(matrix.os, 'windows-')
        run: cargo build --release --manifest-path apps/tray/Cargo.toml --target ${{ matrix.target }}

      - name: Build clickable Windows installer
        if: startsWith(matrix.os, 'windows-')
        run: cargo build --release --manifest-path apps/windows-installer/Cargo.toml --target ${{ matrix.target }}

      - name: Package pinned Windows llama.cpp CUDA runtime
        if: startsWith(matrix.os, 'windows-')
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\scripts\package-windows-llama-runtime.ps1 -Tag b9856 -CudaVersion 12.4 -OutputPath ${{ matrix.runtime_binary_name }}

      - name: Package pinned Windows llama.cpp Vulkan runtime
        if: startsWith(matrix.os, 'windows-')
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\scripts\package-windows-vulkan-runtime.ps1 -Tag b9856 -OutputPath ${{ matrix.vulkan_runtime_binary_name }}

      - name: Prepare binary
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.executable_name }} ${{ matrix.binary_name }}
          cp target/${{ matrix.target }}/release/${{ matrix.mundusx_executable_name }} ${{ matrix.mundusx_binary_name }}
          cp target/${{ matrix.target }}/release/${{ matrix.agent_server_executable_name }} ${{ matrix.agent_server_binary_name }}
          cp target/${{ matrix.target }}/release/${{ matrix.agent_executable_name }} ${{ matrix.agent_binary_name }}
          if [[ -n "${{ matrix.tray_binary_name }}" ]]; then
            cp target/${{ matrix.target }}/release/${{ matrix.tray_executable_name }} ${{ matrix.tray_binary_name }}
          fi
          if [[ -n "${{ matrix.setup_binary_name }}" ]]; then
            cp target/${{ matrix.target }}/release/${{ matrix.setup_executable_name }} ${{ matrix.setup_binary_name }}
          fi
          if [[ "${{ matrix.os }}" != windows-* ]]; then
            chmod +x ${{ matrix.binary_name }}
            chmod +x ${{ matrix.mundusx_binary_name }}
            chmod +x ${{ matrix.agent_server_binary_name }}
            chmod +x ${{ matrix.agent_binary_name }}
          fi

      - name: Generate checksum
        shell: bash
        run: |
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 ${{ matrix.binary_name }} > ${{ matrix.binary_name }}.sha256
            shasum -a 256 ${{ matrix.mundusx_binary_name }} > ${{ matrix.mundusx_binary_name }}.sha256
            shasum -a 256 ${{ matrix.agent_server_binary_name }} > ${{ matrix.agent_server_binary_name }}.sha256
            shasum -a 256 ${{ matrix.agent_binary_name }} > ${{ matrix.agent_binary_name }}.sha256
            if [[ -n "${{ matrix.tray_binary_name }}" ]]; then shasum -a 256 ${{ matrix.tray_binary_name }} > ${{ matrix.tray_binary_name }}.sha256; fi
            if [[ -n "${{ matrix.setup_binary_name }}" ]]; then shasum -a 256 ${{ matrix.setup_binary_name }} > ${{ matrix.setup_binary_name }}.sha256; fi
            if [[ -n "${{ matrix.vulkan_runtime_binary_name }}" ]]; then shasum -a 256 ${{ matrix.vulkan_runtime_binary_name }} > ${{ matrix.vulkan_runtime_binary_name }}.sha256; fi
          elif command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.binary_name }} > ${{ matrix.binary_name }}.sha256
            sha256sum ${{ matrix.mundusx_binary_name }} > ${{ matrix.mundusx_binary_name }}.sha256
            sha256sum ${{ matrix.agent_server_binary_name }} > ${{ matrix.agent_server_binary_name }}.sha256
            sha256sum ${{ matrix.agent_binary_name }} > ${{ matrix.agent_binary_name }}.sha256
            if [[ -n "${{ matrix.tray_binary_name }}" ]]; then sha256sum ${{ matrix.tray_binary_name }} > ${{ matrix.tray_binary_name }}.sha256; fi
            if [[ -n "${{ matrix.setup_binary_name }}" ]]; then sha256sum ${{ matrix.setup_binary_name }} > ${{ matrix.setup_binary_name }}.sha256; fi
            if [[ -n "${{ matrix.vulkan_runtime_binary_name }}" ]]; then sha256sum ${{ matrix.vulkan_runtime_binary_name }} > ${{ matrix.vulkan_runtime_binary_name }}.sha256; fi
          else
            echo "checksum tooling not found (need shasum or sha256sum)" >&2
            exit 1
          fi

      - name: Build macOS package
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          ./scripts/package-macos-pkg.sh . "${{ matrix.binary_name }}" "${{ matrix.agent_binary_name }}" "${{ matrix.pkg_name }}" "${RELEASE_TAG#cli-v}"
          shasum -a 256 "${{ matrix.pkg_name }}" > "${{ matrix.pkg_name }}.sha256"
          shasum -a 256 -c "${{ matrix.pkg_name }}.sha256"

      - name: Verify checksum
        shell: bash
        run: |
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 -c ${{ matrix.binary_name }}.sha256
            shasum -a 256 -c ${{ matrix.mundusx_binary_name }}.sha256
            shasum -a 256 -c ${{ matrix.agent_server_binary_name }}.sha256
            shasum -a 256 -c ${{ matrix.agent_binary_name }}.sha256
            if [[ -n "${{ matrix.tray_binary_name }}" ]]; then shasum -a 256 -c ${{ matrix.tray_binary_name }}.sha256; fi
            if [[ -n "${{ matrix.setup_binary_name }}" ]]; then shasum -a 256 -c ${{ matrix.setup_binary_name }}.sha256; fi
            if [[ -n "${{ matrix.vulkan_runtime_binary_name }}" ]]; then shasum -a 256 -c ${{ matrix.vulkan_runtime_binary_name }}.sha256; fi
          elif command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c ${{ matrix.binary_name }}.sha256
            sha256sum -c ${{ matrix.mundusx_binary_name }}.sha256
            sha256sum -c ${{ matrix.agent_server_binary_name }}.sha256
            sha256sum -c ${{ matrix.agent_binary_name }}.sha256
            if [[ -n "${{ matrix.tray_binary_name }}" ]]; then sha256sum -c ${{ matrix.tray_binary_name }}.sha256; fi
            if [[ -n "${{ matrix.setup_binary_name }}" ]]; then sha256sum -c ${{ matrix.setup_binary_name }}.sha256; fi
            if [[ -n "${{ matrix.vulkan_runtime_binary_name }}" ]]; then sha256sum -c ${{ matrix.vulkan_runtime_binary_name }}.sha256; fi
          else
            echo "checksum tooling not found (need shasum or sha256sum)" >&2
            exit 1
          fi

      - name: Verify packaging
        shell: bash
        run: |
          ./scripts/verify-release-packaging.sh . ${{ matrix.binary_name }} ${{ matrix.agent_binary_name }}

      - name: Prepare signed manifest
        shell: bash
        env:
          OPENGPU_RELEASE_SIGNING_PRIVATE_KEY_PEM_B64: ${{ secrets.OPENGPU_RELEASE_SIGNING_PRIVATE_KEY_PEM_B64 }}
          OPENGPU_RELEASE_SIGNING_PUBLIC_KEY_PEM_B64: ${{ secrets.OPENGPU_RELEASE_SIGNING_PUBLIC_KEY_PEM_B64 }}
        run: |
          ./scripts/release-signing.sh prepare . ${{ matrix.binary_name }} ${{ env.RELEASE_TAG }} ${{ env.RELEASE_TAG }}

      - name: Verify every manifest asset
        shell: bash
        run: python3 ./scripts/verify-release-manifest-assets.py .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: |
            ${{ matrix.binary_name }}
            ${{ matrix.binary_name }}.sha256
            ${{ matrix.mundusx_binary_name }}
            ${{ matrix.mundusx_binary_name }}.sha256
            ${{ matrix.agent_server_binary_name }}
            ${{ matrix.agent_server_binary_name }}.sha256
            ${{ matrix.agent_binary_name }}
            ${{ matrix.agent_binary_name }}.sha256
            ${{ matrix.tray_binary_name }}
            ${{ matrix.tray_binary_name }}.sha256
            ${{ matrix.setup_binary_name }}
            ${{ matrix.setup_binary_name }}.sha256
            ${{ matrix.runtime_binary_name }}
            ${{ matrix.runtime_binary_name }}.sha256
            ${{ matrix.vulkan_runtime_binary_name }}
            ${{ matrix.vulkan_runtime_binary_name }}.sha256
            ${{ matrix.pkg_name }}
            ${{ matrix.pkg_name }}.sha256
            release-manifest.json
            release-manifest.json.sig
            install.sh
            install.ps1

  release:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: linux
            label: Linux x86_64
            binary_name: opengpu-x86_64-unknown-linux-gnu
            agent_name: opengpu-node-agent-x86_64-unknown-linux-gnu
          - channel: macos
            label: macOS Apple Silicon
            binary_name: opengpu-aarch64-apple-darwin
            agent_name: opengpu-node-agent-aarch64-apple-darwin
          - channel: windows
            label: Windows x86_64
            binary_name: opengpu-x86_64-pc-windows-msvc.exe
            agent_name: opengpu-node-agent-x86_64-pc-windows-msvc.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare platform release files
        id: platform
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#cli-}"
          platform_tag="cli-${{ matrix.channel }}-${version}"
          release_name="MundusX ${{ matrix.label }} CLI ${version}"
          upload_dir="release-upload/${{ matrix.channel }}"
          artifact_dir="dist/${{ matrix.binary_name }}"
          mkdir -p "$upload_dir"
          if [[ ! -d "$artifact_dir" ]]; then
            echo "missing artifact directory: $artifact_dir" >&2
            exit 1
          fi
          cp "$artifact_dir"/* "$upload_dir"/
          chmod +x "$upload_dir/${{ matrix.binary_name }}"
          chmod +x "$upload_dir/${{ matrix.agent_name }}"
          echo "tag=$platform_tag" >> "$GITHUB_OUTPUT"
          echo "name=$release_name" >> "$GITHUB_OUTPUT"
          echo "upload_dir=$upload_dir" >> "$GITHUB_OUTPUT"
          echo "Prepared $release_name as $platform_tag"

      - name: Verify platform release files
        env:
          OPENGPU_RELEASE_SIGNING_PUBLIC_KEY_PEM_B64: ${{ secrets.OPENGPU_RELEASE_SIGNING_PUBLIC_KEY_PEM_B64 }}
          UPLOAD_DIR: ${{ steps.platform.outputs.upload_dir }}
        run: |
          ./scripts/verify-release-packaging.sh "$UPLOAD_DIR" "${{ matrix.binary_name }}" "${{ matrix.agent_name }}"
          ./scripts/release-signing.sh verify "$UPLOAD_DIR" "${{ matrix.binary_name }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.platform.outputs.upload_dir }}/*
          tag_name: ${{ steps.platform.outputs.tag }}
          name: ${{ steps.platform.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-windows-stable:
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download signed Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: opengpu-x86_64-pc-windows-msvc.exe
          path: release-stable

      - name: Verify signed stable bundle
        env:
          OPENGPU_RELEASE_SIGNING_PUBLIC_KEY_PEM_B64: ${{ secrets.OPENGPU_RELEASE_SIGNING_PUBLIC_KEY_PEM_B64 }}
        run: |
          chmod +x release-stable/opengpu-x86_64-pc-windows-msvc.exe release-stable/opengpu-node-agent-x86_64-pc-windows-msvc.exe
          ./scripts/verify-release-packaging.sh release-stable opengpu-x86_64-pc-windows-msvc.exe opengpu-node-agent-x86_64-pc-windows-msvc.exe
          ./scripts/release-signing.sh verify release-stable opengpu-x86_64-pc-windows-msvc.exe

      - name: Publish atomic Windows stable channel
        env:
          GH_TOKEN: ${{ secrets.MUNDUSX_PUBLIC_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "MUNDUSX_PUBLIC_RELEASES_TOKEN is required" >&2; exit 1; }
          gh release upload opengpu-prod release-stable/* --repo mundusx/releases --clobber

      - name: Verify public stable manifest
        env:
          GH_TOKEN: ${{ secrets.MUNDUSX_PUBLIC_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          gh release download opengpu-prod --repo mundusx/releases --pattern release-manifest.json --dir public-proof --clobber
          cmp release-stable/release-manifest.json public-proof/release-manifest.json
