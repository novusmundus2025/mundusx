name: Chat connector services
on:
  pull_request:
  push:
    branches: [uat, 'codex/unix-chat-recovery']
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/test-chat-service.sh
      - run: cargo test -p opengpu --bin mundusx connector_lock_prevents_duplicates_and_releases_on_exit
