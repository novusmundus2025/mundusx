name: Release CLI Linux

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Linux release tag to build and publish, for example cli-linux-v0.1.14"
        required: true
        type: string
  push:
    tags:
      - "cli-linux-v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  MUNDUSX_RELEASE_VERSION: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            cross_compiler: ""
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            cross_compiler: ""

    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      BINARY_NAME: opengpu-${{ matrix.target }}
      AGENT_BINARY_NAME: opengpu-node-agent-${{ matrix.target }}
      MUNDUSX_BINARY_NAME: mundusx-${{ matrix.target }}
      AGENT_SERVER_BINARY_NAME: mundusx-agent-server-${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Test progress and readiness on this OS
        run: |
          cargo test -p opengpu --bin opengpu operation_progress --target ${{ env.TARGET }}
          cargo test -p opengpu --bin opengpu local_readiness --target ${{ env.TARGET }}
          cargo test -p opengpu-node-agent --bin opengpu-node-agent download_progress --target ${{ env.TARGET }}
          cargo test -p opengpu-node-agent --bin opengpu-node-agent runtime_progress --target ${{ env.TARGET }}
          cargo test -p opengpu --bin opengpu startup_relay --target ${{ env.TARGET }}
          cargo test -p opengpu-node-agent --bin opengpu-node-agent parses_vllm_startup_progress --target ${{ env.TARGET }}
          cargo test -p opengpu-node-agent --bin opengpu-node-agent classification_ --target ${{ env.TARGET }}

      - name: Test private media gateway authentication
        run: |
          cargo test -p mundusx-control-plane-auth --target "${TARGET}"
          cargo test -p opengpu --bin opengpu media_worker --target "${TARGET}"
          cd workers/media && python3 -m unittest test_artifact_upload

      - name: Build CLIs and agents
        # Context discovery and Muse chat defaults are release-critical regressions.
        # Run on both native Linux architectures before producing binaries.
        run: |
          cargo test -p opengpu-node-agent --bin opengpu-node-agent served_ --target "${TARGET}"
          cargo test -p opengpu-node-agent --bin opengpu-node-agent muse_plain_chat --target "${TARGET}"
          cargo build --release --manifest-path apps/cli/Cargo.toml --target "${TARGET}"
          cargo build --release --manifest-path apps/agent-server/Cargo.toml --target "${TARGET}"
          cargo build --release --manifest-path agents/node/Cargo.toml --bin opengpu-node-agent --target "${TARGET}"

      - name: Prepare binaries and checksums
        run: |
          cp "target/${TARGET}/release/opengpu" "${BINARY_NAME}"
          cp "target/${TARGET}/release/opengpu-node-agent" "${AGENT_BINARY_NAME}"
          cp "target/${TARGET}/release/mundusx" "${MUNDUSX_BINARY_NAME}"
          cp "target/${TARGET}/release/mundusx-agent-server" "${AGENT_SERVER_BINARY_NAME}"
          chmod +x "${BINARY_NAME}" "${AGENT_BINARY_NAME}" "${MUNDUSX_BINARY_NAME}" "${AGENT_SERVER_BINARY_NAME}"
          sha256sum "${BINARY_NAME}" > "${BINARY_NAME}.sha256"
          sha256sum "${AGENT_BINARY_NAME}" > "${AGENT_BINARY_NAME}.sha256"
          sha256sum "${MUNDUSX_BINARY_NAME}" > "${MUNDUSX_BINARY_NAME}.sha256"
          sha256sum "${AGENT_SERVER_BINARY_NAME}" > "${AGENT_SERVER_BINARY_NAME}.sha256"
          sha256sum -c "${BINARY_NAME}.sha256"
          sha256sum -c "${AGENT_BINARY_NAME}.sha256"
          sha256sum -c "${MUNDUSX_BINARY_NAME}.sha256"
          sha256sum -c "${AGENT_SERVER_BINARY_NAME}.sha256"

      - name: Package Linux Vulkan runtime
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libvulkan-dev glslc glslang-tools spirv-headers
          bash scripts/package-linux-vulkan-runtime.sh

      - name: Verify packaging
        run: ./scripts/verify-release-packaging.sh . "${BINARY_NAME}" "${AGENT_BINARY_NAME}"

      - name: Preserve native assets for manual release assembly
        uses: actions/upload-artifact@v4
        with:
          name: manual-${{ env.BINARY_NAME }}
          path: |
            ${{ env.BINARY_NAME }}
            ${{ env.BINARY_NAME }}.sha256
            ${{ env.AGENT_BINARY_NAME }}
            ${{ env.AGENT_BINARY_NAME }}.sha256
            ${{ env.MUNDUSX_BINARY_NAME }}
            ${{ env.MUNDUSX_BINARY_NAME }}.sha256
            ${{ env.AGENT_SERVER_BINARY_NAME }}
            ${{ env.AGENT_SERVER_BINARY_NAME }}.sha256
            install.sh
            llama-runtime-*-vulkan.tar.gz*

      - name: Prepare signed manifest
        env:
          OPENGPU_RELEASE_SIGNING_PRIVATE_KEY_PEM_B64: ${{ secrets.OPENGPU_RELEASE_SIGNING_PRIVATE_KEY_PEM_B64 }}
          OPENGPU_RELEASE_SIGNING_PUBLIC_KEY_PEM_B64: ${{ secrets.OPENGPU_RELEASE_SIGNING_PUBLIC_KEY_PEM_B64 }}
        run: |
          ./scripts/release-signing.sh prepare . "${BINARY_NAME}" "${RELEASE_TAG}" "${RELEASE_TAG}"
          python3 ./scripts/verify-release-manifest-assets.py .
          mv release-manifest.json "release-manifest-${TARGET}.json"
          mv release-manifest.json.sig "release-manifest-${TARGET}.json.sig"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}
          path: |
            ${{ env.BINARY_NAME }}
            ${{ env.BINARY_NAME }}.sha256
            ${{ env.AGENT_BINARY_NAME }}
            ${{ env.AGENT_BINARY_NAME }}.sha256
            ${{ env.MUNDUSX_BINARY_NAME }}
            ${{ env.MUNDUSX_BINARY_NAME }}.sha256
            ${{ env.AGENT_SERVER_BINARY_NAME }}
            ${{ env.AGENT_SERVER_BINARY_NAME }}.sha256
            release-manifest-${{ env.TARGET }}.json
            release-manifest-${{ env.TARGET }}.json.sig
            install.sh
            llama-runtime-*-vulkan.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: opengpu-*
          merge-multiple: true
          path: dist

      - name: Publish Linux release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ env.RELEASE_TAG }}
          name: MundusX Linux CLI ${{ env.RELEASE_TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
