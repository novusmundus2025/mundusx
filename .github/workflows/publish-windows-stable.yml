name: Publish Windows Stable Channel

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version already published to the Windows release, for example 0.1.58"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download signed Windows release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid version: $VERSION" >&2; exit 1; }
          mkdir -p release-stable
          gh release download "cli-windows-v$VERSION" --repo mundusx/mundusx --dir release-stable

      - name: Verify signed stable bundle
        env:
          OPENGPU_RELEASE_SIGNING_PUBLIC_KEY_PEM_B64: ${{ secrets.OPENGPU_RELEASE_SIGNING_PUBLIC_KEY_PEM_B64 }}
        run: |
          chmod +x release-stable/opengpu-x86_64-pc-windows-msvc.exe release-stable/opengpu-node-agent-x86_64-pc-windows-msvc.exe
          ./scripts/verify-release-packaging.sh release-stable opengpu-x86_64-pc-windows-msvc.exe opengpu-node-agent-x86_64-pc-windows-msvc.exe
          ./scripts/release-signing.sh verify release-stable opengpu-x86_64-pc-windows-msvc.exe

      - name: Publish atomic Windows stable channel
        env:
          GH_TOKEN: ${{ secrets.MUNDUSX_PUBLIC_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "MUNDUSX_PUBLIC_RELEASES_TOKEN is required" >&2; exit 1; }
          gh release upload opengpu-prod release-stable/* --repo mundusx/releases --clobber

      - name: Verify public stable manifest
        env:
          GH_TOKEN: ${{ secrets.MUNDUSX_PUBLIC_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p public-proof
          gh release download opengpu-prod --repo mundusx/releases --pattern release-manifest.json --dir public-proof --clobber
          cmp release-stable/release-manifest.json public-proof/release-manifest.json
