name: Release Harness runner

on:
  push:
    tags:
      - "harness-runner-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing harness-runner-v* tag to publish
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: mundusx-harness-runner-x86_64-unknown-linux-gnu
            executable: mundusx-harness-runner
          - os: macos-14
            target: aarch64-apple-darwin
            asset: mundusx-harness-runner-aarch64-apple-darwin
            executable: mundusx-harness-runner
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: mundusx-harness-runner-x86_64-pc-windows-msvc.exe
            executable: mundusx-harness-runner.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build separate user-owned runner
        run: cargo build --release --manifest-path agents/node/Cargo.toml --features harness-runner --bin mundusx-harness-runner --target ${{ matrix.target }}
      - name: Build Windows one-click runner setup
        if: runner.os == 'Windows'
        run: cargo build --release --manifest-path apps/windows-installer/Cargo.toml --bin mundusx-harness-setup --target ${{ matrix.target }}
      - name: Package Unix asset and checksum
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
      - name: Package Windows asset and checksum
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Copy-Item -LiteralPath "target/${{ matrix.target }}/release/${{ matrix.executable }}" -Destination "${{ matrix.asset }}"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "${{ matrix.asset }}").Hash.ToLowerInvariant()
          "$hash  ${{ matrix.asset }}" | Set-Content -NoNewline -LiteralPath "${{ matrix.asset }}.sha256"
          Copy-Item -LiteralPath "target/${{ matrix.target }}/release/mundusx-harness-setup.exe" -Destination "mundusx-harness-setup-windows-x86_64.exe"
          $setupHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "mundusx-harness-setup-windows-x86_64.exe").Hash.ToLowerInvariant()
          "$setupHash  mundusx-harness-setup-windows-x86_64.exe" | Set-Content -NoNewline -LiteralPath "mundusx-harness-setup-windows-x86_64.exe.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
            mundusx-harness-setup-windows-x86_64.exe
            mundusx-harness-setup-windows-x86_64.exe.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      MUNDUSX_PUBLIC_RELEASES_TOKEN: ${{ secrets.MUNDUSX_PUBLIC_RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Package Unix installer fallback
        shell: bash
        run: |
          cp install-harness-runner.sh release-assets/install-harness-runner.sh
          chmod +x release-assets/install-harness-runner.sh
          (cd release-assets && shasum -a 256 install-harness-runner.sh > install-harness-runner.sh.sha256)
      - name: Prepare signed runner release manifest
        shell: bash
        env:
          OPENGPU_RELEASE_SIGNING_PRIVATE_KEY_PEM_B64: ${{ secrets.OPENGPU_RELEASE_SIGNING_PRIVATE_KEY_PEM_B64 }}
          OPENGPU_RELEASE_SIGNING_PUBLIC_KEY_PEM_B64: ${{ secrets.OPENGPU_RELEASE_SIGNING_PUBLIC_KEY_PEM_B64 }}
        run: ./scripts/release-signing.sh prepare release-assets mundusx-harness-setup-windows-x86_64.exe "${{ github.event.inputs.release_tag || github.ref_name }}" "${{ github.event.inputs.release_tag || github.ref_name }}"
      - name: Verify signed runner release manifest
        shell: bash
        env:
          OPENGPU_RELEASE_SIGNING_PUBLIC_KEY_PEM_B64: ${{ secrets.OPENGPU_RELEASE_SIGNING_PUBLIC_KEY_PEM_B64 }}
        run: ./scripts/release-signing.sh verify release-assets mundusx-harness-setup-windows-x86_64.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: MundusX Harness runner ${{ github.event.inputs.release_tag || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
      - name: Publish public binary distribution
        if: ${{ env.MUNDUSX_PUBLIC_RELEASES_TOKEN != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ env.MUNDUSX_PUBLIC_RELEASES_TOKEN }}
        run: |
          tag="${{ github.event.inputs.release_tag || github.ref_name }}"
          if gh release view "$tag" --repo mundusx/releases >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --repo mundusx/releases --clobber
            gh release edit "$tag" --repo mundusx/releases --latest --prerelease=false
          else
            gh release create "$tag" release-assets/* --repo mundusx/releases --target main --latest \
              --title "MundusX Harness runner $tag" \
              --notes "Public signed binary distribution. Source code remains private."
          fi
      - name: Report missing public release credential
        if: ${{ env.MUNDUSX_PUBLIC_RELEASES_TOKEN == '' }}
        run: echo "::warning::MUNDUSX_PUBLIC_RELEASES_TOKEN is not configured; copy this release to mundusx/releases manually."
