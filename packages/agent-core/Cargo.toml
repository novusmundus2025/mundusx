[package]
name = "mundusx-agent-core"
version = "0.1.28"
edition = "2021"
description = "Provider-neutral local agent runtime primitives for MundusX"
license = "Apache-2.0"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }

