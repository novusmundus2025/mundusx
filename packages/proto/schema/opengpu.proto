syntax = "proto3";

package opengpu.v1;

enum Backend {
  BACKEND_UNSPECIFIED = 0;
  BACKEND_M = 1;
  BACKEND_CUDA = 2;
}

enum AgentState {
  AGENT_STATE_UNSPECIFIED = 0;
  AGENT_STATE_STARTING = 1;
  AGENT_STATE_READY = 2;
  AGENT_STATE_BUSY = 3;
  AGENT_STATE_PAUSED = 4;
  AGENT_STATE_STOPPED = 5;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED = 1;
  JOB_STATUS_ASSIGNED = 2;
  JOB_STATUS_COMPLETED = 3;
  JOB_STATUS_FAILED = 4;
}

message NodeHeartbeat {
  string node_id = 1;
  Backend backend = 2;
  AgentState agent_state = 3;
  uint32 available_memory_mb = 4;
  uint32 available_gpu_percent = 5;
  string updated_at = 6;
  uint32 contribution_percent = 7;
}

message JobRequest {
  string request_id = 1;
  string prompt = 2;
  Backend preferred_backend = 3;
  string model = 4;
  string conversation_id = 5;
  string system_prompt = 6;
  uint32 max_tokens = 7;
  float temperature = 8;
  float top_p = 9;
  uint64 seed = 10;
}

message JobResponse {
  string request_id = 1;
  string node_id = 2;
  string output = 3;
  string worker_id = 4;
}

message JobRecord {
  string job_id = 1;
  string request_id = 2;
  string prompt = 3;
  Backend preferred_backend = 4;
  string model = 5;
  JobStatus status = 6;
  string submitted_at = 7;
  string assigned_node_id = 8;
  string assigned_at = 9;
  string completed_at = 10;
  string worker_id = 11;
  Backend backend = 12;
  string output = 13;
  string error = 14;
}

message JobClaimResponse {
  JobRecord job = 1;
}

message JobCompletion {
  string job_id = 1;
  string node_id = 2;
  string worker_id = 3;
  Backend backend = 4;
  JobStatus status = 5;
  string output = 6;
  string error = 7;
}

message AgentRegistration {
  string node_id = 1;
  string public_key_fingerprint = 2;
  Backend backend = 3;
  uint32 contribution_percent = 4;
  string agent_version = 5;
}

message WorkerLaunchRequest {
  string job_id = 1;
  string node_id = 2;
  Backend backend = 3;
  string prompt = 4;
  string model = 5;
  string system_prompt = 6;
  uint32 max_tokens = 7;
  float temperature = 8;
  float top_p = 9;
  uint64 seed = 10;
}

message WorkerLaunchResponse {
  string job_id = 1;
  string worker_id = 2;
  string status = 3;
  string error = 4;
}

message WorkerStatus {
  string worker_id = 1;
  string node_id = 2;
  string status = 3;
  string updated_at = 4;
}
