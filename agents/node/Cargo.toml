[package]
name = "opengpu-node-agent"
version = "0.1.0"
edition = "2021"
description = "NovusX node agent"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
ed25519-dalek = "2.1"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
