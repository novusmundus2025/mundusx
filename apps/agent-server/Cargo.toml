[package]
name = "mundusx-agent-server"
version = "0.1.57"
edition = "2021"
description = "Local HTTP adapter for the MundusX agent runtime"
license = "Apache-2.0"

[[bin]]
name = "mundusx-agent-server"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
mundusx-agent-core = { path = "../../packages/agent-core" }
mundusx-agent-skills = { path = "../../packages/agent-skills" }
mundusx-agent-tools = { path = "../../packages/agent-tools" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
ureq = { version = "2.12", features = ["json"] }
uuid = { version = "1.10", features = ["v4"] }
