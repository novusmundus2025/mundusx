[package]
name = "opengpu"
version = "0.1.0"
edition = "2021"
description = "OpenGPU CLI"
license = "UNLICENSED"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }

