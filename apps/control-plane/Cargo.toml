[package]
name = "opengpu-control-plane"
version = "0.1.0"
edition = "2021"
description = "NovusX control plane"
license = "UNLICENSED"

[dependencies]
dirs = "5.0"
ed25519-dalek = "2.1"
hex = "0.4"
native-tls = "0.2"
postgres = "0.19"
postgres-native-tls = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
