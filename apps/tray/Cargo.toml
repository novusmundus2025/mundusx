[package]
name = "mundusx-tray"
version = "0.1.34"
edition = "2021"
description = "MundusX Windows contributor tray companion"
license = "Apache-2.0"

[[bin]]
name = "mundusx-tray"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
